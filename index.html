<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="description" content="Local PDF and image tools.">
  <title>Paperplane</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">paperplane <span>0.2</span></a>
    <nav aria-label="Main navigation">
      <a href="#tools">Tools</a>
      <a href="#about">About</a>
      <a href="https://github.com/" target="_blank" rel="noreferrer">Source</a>
      <button id="themeToggle" type="button" aria-label="Toggle colour scheme" title="Toggle colour scheme">◐</button>
    </nav>
  </header>
  <main>
    <section class="intro">
      <h1>PDF tools</h1>
      <p>runs in browser, your files are yours to keep</p>
    </section>
    <section id="tools" class="tools-section">
      <div class="section-heading">
        <h2>Tools</h2>
        <label class="search"><span>⌕</span><input id="toolSearch" type="search" placeholder="Search" aria-label="Search tools"></label>
      </div>
      <div id="categoryTabs" class="category-tabs" aria-label="Filter tools"></div>
      <div id="toolGrid" class="tool-grid"></div>
      <p id="emptyState" class="empty-state" hidden>no results.</p>
    </section>
    <section id="about" class="about-section">
      <h2>About</h2>
      <p>static site soooooo no servers or uploads 4 u.</p>
      <p>some tools load libraries from a CDN.</p>
    </section>
  </main>
  <footer><span>Paperplane</span><span>MIT license</span></footer>
  <dialog id="toolDialog" class="tool-dialog">
    <div class="dialog-head">
      <div><p id="dialogCategory" class="dialog-category"></p><h2 id="dialogTitle"></h2></div>
      <button id="closeDialog" class="close-button" type="button" aria-label="Close">×</button>
    </div>
    <div id="toolPanel"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
